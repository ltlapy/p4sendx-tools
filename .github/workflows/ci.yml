name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

env:
  UFBT_VERSION: "0.2.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install pillow
      - run: sh tests/run.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Releases ship these three. Momentum has API 87 but other struct layouts, so it gets its own.
          - name: momentum
            update: --hw-target f7 --url https://up.momentum-fw.dev/builds/firmware/mntm-012/flipper-z-f7-sdk-mntm-012.zip
          - name: api87
            update: --hw-target f7 --url https://update.flipperzero.one/builds/firmware/1.4.3/flipper-z-f7-sdk-1.4.3.zip
          - name: api88
            update: --hw-target f7 --url https://update.flipperzero.one/builds/firmware/1.5.1/flipper-z-f7-sdk-1.5.1.zip
          # Warnings only: the newest releases may break the build before we catch up.
          - name: official-latest
            update: --channel release
            optional: true
          - name: momentum-latest
            update: --index-url https://up.momentum-fw.dev/firmware/directory.json --channel release
            optional: true
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install "ufbt==$UFBT_VERSION"
      - run: ufbt update ${{ matrix.update }}
      - name: Build
        working-directory: flipper/sb4_send
        run: ufbt
      - uses: actions/upload-artifact@v7
        with:
          name: sb4_send-${{ matrix.name }}
          path: flipper/sb4_send/dist/sb4_send.fap
